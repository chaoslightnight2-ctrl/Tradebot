name: Run max profit optimizer

on:
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile sontrade_bot.py optimize_until_target.py explain_scores.py run_max_profit_optimizer.py
      - name: Run zero-input max-profit optimizer
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: 'true'
          ALPACA_SYMBOLS: AAPL
          SONTRADE_BENCHMARK_SYMBOLS: SPY,QQQ
          SONTRADE_DATA_PROVIDER: yfinance
          ALPACA_TIMEFRAME: 1Day
          SONTRADE_LOOKBACK_DAYS: 2500
        run: |
          python run_max_profit_optimizer.py
      - name: Print best settings
        if: always()
        run: |
          ls -la
          test -f sonayarlar.json && cat sonayarlar.json || true
          test -f sonayarlar.env && cat sonayarlar.env || true
      - name: Upload optimizer outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonayarlar
          path: |
            sonayarlar.json
            sonayarlar.env
            sontrade_model_best.joblib
            sontrade_model.joblib
          if-no-files-found: warn
