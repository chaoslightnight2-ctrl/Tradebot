name: Paper trade during NY market hours

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. This broad Mon-Fri window covers NYSE/Nasdaq sessions
    # during both EST and EDT. Alpaca market clock below is the final source of truth.
    - cron: '*/15 13-21 * * 1-5'

concurrency:
  group: paper-trade-market-hours
  cancel-in-progress: true

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile sontrade_bot.py explain_scores.py optimize_until_target.py run_max_profit_optimizer.py

      - name: Check Alpaca market clock
        id: clock
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: 'true'
        run: |
          python - <<'PY'
          import os
          import sontrade_bot as bot

          bot.load_dotenv()
          trading, _ = bot.alpaca_clients()
          clock = trading.get_clock()

          is_open = bool(clock.is_open)
          print(f"Alpaca market open: {is_open}")
          print(f"timestamp={clock.timestamp}")
          print(f"next_open={clock.next_open}")
          print(f"next_close={clock.next_close}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"is_open={str(is_open).lower()}\n")
          PY

      - name: Run paper trade once
        if: steps.clock.outputs.is_open == 'true'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: 'true'
          ALPACA_SYMBOLS: AAPL
          SONTRADE_BENCHMARK_SYMBOLS: SPY,QQQ
          SONTRADE_DATA_PROVIDER: yfinance
          ALPACA_DATA_FEED: iex
          ALPACA_TIMEFRAME: 1Day
          SONTRADE_LOOKBACK_DAYS: 2500
          SONTRADE_LOOP_SECONDS: 900
        run: |
          echo "NY market is open. Running one paper-trade cycle."
          python sontrade_bot.py trade

      - name: Skip because market is closed
        if: steps.clock.outputs.is_open != 'true'
        run: |
          echo "NY market is closed according to Alpaca clock. No trade cycle will run."
