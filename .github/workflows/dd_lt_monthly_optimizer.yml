name: DD below monthly optimizer

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Symbols to optimize
        required: true
        default: AAPL
      timeout_seconds:
        description: Optimizer timeout seconds
        required: true
        default: "18000"
      max_trials:
        description: Maximum randomized trials before timeout
        required: true
        default: "5000"
  push:
    branches:
      - main
    paths:
      - "tools/optimize_dd_lt_monthly.py"
      - "tools/optimize_monthly15_lowdd.py"
      - ".github/workflows/dd_lt_monthly_optimizer.yml"
      - "sontrade_bot.py"
      - "requirements.txt"

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 310
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run optimizer
        env:
          SONTRADE_DATA_PROVIDER: yfinance
        run: |
          python tools/optimize_monthly15_lowdd.py \
            --symbols "${{ github.event.inputs.symbols || 'AAPL' }}" \
            --lookback-days 2500 \
            --timeout-seconds "${{ github.event.inputs.timeout_seconds || '18000' }}" \
            --max-trials "${{ github.event.inputs.max_trials || '5000' }}" \
            --min-monthly-return-pct 15 \
            --min-total-trades 80 \
            --min-oos-trades 30

      - name: Show final report
        if: always()
        run: |
          if [ -f reports/DD_LT_MONTHLY_OPTIMIZER_REPORT.md ]; then
            cat reports/DD_LT_MONTHLY_OPTIMIZER_REPORT.md
          fi

      - name: Upload optimizer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly15-lowdd-optimizer-reports
          path: |
            reports/dd_lt_monthly_optimizer_trials.jsonl
            reports/dd_lt_monthly_valid_candidates.json
            reports/dd_lt_monthly_best_config.json
            reports/DD_LT_MONTHLY_OPTIMIZER_REPORT.md
          if-no-files-found: warn
