name: DD below monthly optimizer

# Restart trigger for 1h monthly15 lowDD no-DD-gate run.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Symbols to optimize
        required: true
        default: AAPL
      timeout_seconds:
        description: Optimizer timeout seconds
        required: true
        default: "10800"
      max_trials:
        description: Maximum randomized trials before timeout
        required: true
        default: "6000"
  push:
    branches:
      - main
    paths:
      - "tools/optimize_dd_lt_monthly.py"
      - "tools/optimize_monthly15_lowdd.py"
      - "tools/optimize_30m_monthly15_lowdd.py"
      - "tools/optimize_1h_monthly15_lowdd_no_dd_gate.py"
      - ".github/workflows/dd_lt_monthly_optimizer.yml"
      - "sontrade_bot.py"
      - "requirements.txt"

concurrency:
  group: dd-below-monthly-optimizer
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run optimizer
        env:
          SONTRADE_DATA_PROVIDER: alpaca
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python tools/optimize_1h_monthly15_lowdd_no_dd_gate.py \
            --symbols "${{ github.event.inputs.symbols || 'AAPL' }}" \
            --data-provider alpaca \
            --timeframe 1h \
            --lookback-days 2500 \
            --timeout-seconds "${{ github.event.inputs.timeout_seconds || '10800' }}" \
            --max-trials "${{ github.event.inputs.max_trials || '6000' }}" \
            --min-monthly-return-pct 12 \
            --min-total-trades 80 \
            --min-oos-trades 25 \
            --bars-per-year 1638

      - name: Show final report
        if: always()
        run: |
          if [ -f reports/DD_LT_MONTHLY_OPTIMIZER_REPORT.md ]; then
            cat reports/DD_LT_MONTHLY_OPTIMIZER_REPORT.md
          fi

      - name: Upload optimizer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-1h-monthly15-lowdd-no-dd-gate-reports
          path: |
            reports/dd_lt_monthly_optimizer_trials.jsonl
            reports/dd_lt_monthly_valid_candidates.json
            reports/dd_lt_monthly_best_config.json
            reports/DD_LT_MONTHLY_OPTIMIZER_REPORT.md
          if-no-files-found: warn
